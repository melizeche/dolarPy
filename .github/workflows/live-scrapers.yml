name: published api check

# Checks the API the server actually publishes, rather than scraping the
# exchange sites from here. Several sources (cambioschaco, continental) serve
# a block page to datacenter IPs, so scraping them from a GitHub runner says
# nothing about whether production captured them -- and it doubled the load on
# twelve small sites every day. Reading dolar.json through the API instead
# judges the document consumers really get, and also catches a dead crontab or
# a stale file, which scraping from here never could.
#
# Use `pytest -m live` locally to fix an individual scraper.
#
# To avoid crying wolf over a blip (ueno goes through a SOCKS tunnel on the
# server and zeroes out if it drops), an issue is only opened when the check
# fails on two consecutive runs.

on:
  schedule:
    # 10:00 in Asunción (UTC-3), comfortably inside the server crontab's
    # 06:00-20:00 Mon-Fri scrape window, so `updated` should be minutes old.
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check the published API
        id: live
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -m published -q --tb=line --no-header | tee live-report.txt

      - name: Look up the previous nightly result
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'live-scrapers.yml',
              event: 'schedule',
              status: 'completed',
              per_page: 10,
            });
            const previous = runs.data.workflow_runs
              .filter(run => run.id !== context.runId)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            const conclusion = previous ? previous.conclusion : 'none';
            core.info(`previous scheduled run: ${conclusion}`);
            core.setOutput('conclusion', conclusion);

      - name: Open or update the issue after a second failure
        if: steps.live.outcome == 'failure' && steps.previous.outputs.conclusion == 'failure'
        uses: actions/github-script@v7
        env:
          TITLE: "Published API check is failing"
        with:
          script: |
            const fs = require('fs');
            const title = process.env.TITLE;
            let report = '';
            try {
              report = fs.readFileSync('live-report.txt', 'utf8').slice(-8000);
            } catch (error) {
              report = '(no report produced)';
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The published API check failed on two consecutive runs, so this',
              'is unlikely to be a blip.',
              '',
              'This reads https://dolar.melizeche.com/api/1.0/ -- the document',
              'the server crontab writes. A zeroed source means that scraper',
              'stopped working (the site changed its markup, started blocking',
              'the server, or for ueno the SOCKS tunnel is down). A stale',
              '`updated` means the crontab itself has stopped. Reproduce, and',
              'then fix one scraper, with:',
              '',
              '```',
              'pytest -m published',
              'pytest -m live -k <source>',
              '```',
              '',
              `Run: ${runUrl}`,
              '',
              '<details><summary>pytest output</summary>',
              '',
              '```',
              report,
              '```',
              '',
              '</details>',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const issue = existing.data.find(item => item.title === title);

            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
              core.info(`commented on #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info(`opened #${created.data.number}`);
            }

      - name: Close the issue once the sources are back
        if: steps.live.outcome == 'success'
        uses: actions/github-script@v7
        env:
          TITLE: "Published API check is failing"
        with:
          script: |
            const title = process.env.TITLE;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const issue = existing.data.find(item => item.title === title);
            if (!issue) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `The published API is healthy again (${runUrl}). Closing.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
            });

      # The next run reads this run's conclusion to decide whether a failure is
      # the second in a row, so the job has to end red when the check failed.
      - name: Reflect the check result in the job status
        if: steps.live.outcome == 'failure'
        run: |
          echo "::error::Published API check failed - see the report above."
          exit 1
