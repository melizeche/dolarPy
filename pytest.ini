[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q -m "not live and not published"
markers =
    live: hits the real exchange sites; excluded by default, run with `pytest -m live`
    published: checks the deployed API at dolar.melizeche.com; excluded by default, run with `pytest -m published`

filterwarnings =
    ignore::DeprecationWarning
